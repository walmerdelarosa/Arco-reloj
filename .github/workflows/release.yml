# Compila Arco para Windows y adjunta el instalador a un release de GitHub.
#
# Se ejecuta:
#   - al publicar un release desde la web (Releases → Draft a new release),
#   - al subir una etiqueta vX.Y.Z (crea el release si no existe),
#   - a mano: Actions → «Release Windows» → Run workflow, indicando la etiqueta
#     (sirve para añadir el instalador a un release ya publicado).
name: Release Windows

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta del release (por ejemplo v1.2.0)"
        required: true

permissions:
  contents: write

# Publicar un release también crea la etiqueta: evita compilar dos veces.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A mano se compila la rama elegida (normalmente main) y se adjunta al release indicado.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Versión
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
          $v = $tag.TrimStart("v", "V")
          # Versión solo numérica (1.4.0) para los metadatos de Windows: quita sufijos como -beta.
          $num = ([regex]::Match($v, '^\d+(\.\d+){0,3}')).Value
          if (-not $num) { $num = "0.0.0" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$v" >> $env:GITHUB_OUTPUT
          "num=$num" >> $env:GITHUB_OUTPUT
          Write-Host "Etiqueta: $tag · versión: $v ($num)"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Pruebas de la lógica
        run: |
          node tests/test_logic.js
          python tests/test_sync.py

      - name: Autoprueba de la interfaz (QML)
        shell: pwsh
        run: |
          # D3D11 con WARP (renderizador por software de Windows): los runners no tienen GPU.
          $env:QSG_RHI_PREFER_SOFTWARE_RENDERER = "1"
          python arco.py --selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Para activar «Iniciar sesión con Google», crea los secretos GOOGLE_CLIENT_ID y
      # GOOGLE_CLIENT_SECRET en Settings → Secrets and variables → Actions (ver docs/google-sync.md).
      - name: Ejecutable (PyInstaller)
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          $extra = @()
          if ($env:GOOGLE_CLIENT_ID) {
            @{ client_id = $env:GOOGLE_CLIENT_ID; client_secret = $env:GOOGLE_CLIENT_SECRET } |
              ConvertTo-Json | Set-Content -Encoding utf8NoBOM google_oauth.json
            $extra = @("--add-data", "google_oauth.json;.")
            Write-Host "Incluye inicio de sesión con Google."
          } else {
            Write-Host "Sin secretos de Google: la sincronización solo ofrecerá carpeta."
          }
          # Metadatos de versión y sin UPX: los ejecutables comprimidos o sin datos del producto
          # dan más falsos positivos en los antivirus.
          python installer/version_info.py "${{ steps.ver.outputs.num }}" version_info.txt
          python -m PyInstaller --noconfirm --clean --windowed --noupx --name ArcoReloj --icon icon.ico --version-file version_info.txt --add-data "qml;qml" --add-data "icon.ico;." @extra arco.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Firma de código: crea los secretos SIGN_PFX_BASE64 y SIGN_PFX_PASSWORD (o SIGN_CERT_SHA1
      # en un runner propio con el certificado instalado). Sin ellos se publica sin firmar.
      # Ver docs/code-signing.es.md.
      - name: Firma del ejecutable
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
          SIGN_CERT_SHA1: ${{ secrets.SIGN_CERT_SHA1 }}
        run: ./installer/sign.ps1 dist\ArcoReloj\ArcoReloj.exe

      - name: Instalador (Inno Setup)
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
          SIGN_CERT_SHA1: ${{ secrets.SIGN_CERT_SHA1 }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $isccArgs = @("/DMyAppVersion=${{ steps.ver.outputs.version }}", "/DMyNumVersion=${{ steps.ver.outputs.num }}")
          if ($env:SIGN_PFX_BASE64 -or $env:SIGN_CERT_SHA1) {
            # Inno firma el instalador y el desinstalador con installer\sign.ps1 ($f = archivo).
            $script = (Resolve-Path installer\sign.ps1).Path
            $isccArgs += "/DSIGN"
            $isccArgs += ('/Sarcosign=pwsh -NoProfile -ExecutionPolicy Bypass -File $q' + $script + '$q $f')
          }
          & $iscc @isccArgs installer\ArcoReloj.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Versión portátil (zip)
        shell: pwsh
        run: Compress-Archive -Path dist\ArcoReloj\* -DestinationPath "dist\ArcoReloj-${{ steps.ver.outputs.version }}-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ArcoReloj-${{ steps.ver.outputs.version }}
          path: |
            dist/ArcoReloj-*-setup.exe
            dist/ArcoReloj-*-portable.zip

      - name: Adjuntar al release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Arco ${{ steps.ver.outputs.version }}
          body_path: ${{ github.event_name == 'push' && 'CHANGELOG-release.md' || '' }}
          files: |
            dist/ArcoReloj-*-setup.exe
            dist/ArcoReloj-*-portable.zip
