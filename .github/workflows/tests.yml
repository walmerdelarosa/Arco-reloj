# Pruebas en cada envío: lógica de tiempo (Node) y carga de la interfaz QML en Windows.
name: Pruebas

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node tests/test_logic.js
      - run: python tests/test_sync.py
      - run: python -m pip install -r requirements.txt
      - name: Autoprueba de la interfaz (QML)
        shell: pwsh
        run: |
          # D3D11 con WARP (renderizador por software de Windows): los runners no tienen GPU.
          $env:QSG_RHI_PREFER_SOFTWARE_RENDERER = "1"
          python arco.py --selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }
